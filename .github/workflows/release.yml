# Builds the desktop app on Windows, macOS and Linux and attaches the files to
# a GitHub release. Push a tag like v0.1.0 to run it:
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win portable nsis
          - os: macos-latest
            args: --mac dmg zip
          - os: ubuntu-latest
            args: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:electron

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No signing certificates: builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
